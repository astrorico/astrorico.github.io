name: Criar VM OCI A1.Flex

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 minutos
  workflow_dispatch:          # permite rodar manualmente também

jobs:
  tentar-criar:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
    steps:
      - name: Verificar se a instância já existe
        id: check
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          silent: false
          command: >-
            compute instance list
            --compartment-id ${{ secrets.OCI_TENANCY_OCID }}
            --display-name minha-vm-site
            --lifecycle-state RUNNING
          query: "data[0].id"

      - name: Gerar arquivos de configuração (metadata e shape-config)
        if: steps.check.outputs.raw_output == 'null' || steps.check.outputs.raw_output == ''
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          python3 -c "import json,os; json.dump({'ssh_authorized_keys': os.environ['SSH_KEY']}, open('metadata.json','w'))"
          python3 -c "import json; json.dump({'ocpus': 2, 'memoryInGBs': 12}, open('shape-config.json','w'))"

      - name: Tentar criar instância
        if: steps.check.outputs.raw_output == 'null' || steps.check.outputs.raw_output == ''
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          silent: false
          command: >-
            compute instance launch
            --availability-domain "yMLU:SA-SAOPAULO-1-AD-1"
            --compartment-id ${{ secrets.OCI_TENANCY_OCID }}
            --shape "VM.Standard.A1.Flex"
            --shape-config file://shape-config.json
            --subnet-id "ocid1.subnet.oc1.sa-saopaulo-1.aaaaaaaavysooixso3rmlymkjxen2v67f6uppf7qw2eypqne7lynuu6opanq"
            --image-id "ocid1.image.oc1.sa-saopaulo-1.aaaaaaaalxwf2qfhwn7czpwyb4cbzt6rrnwaxhslgucqlzuryulz37ljhfqa"
            --display-name "minha-vm-site"
            --assign-public-ip true
            --metadata file://metadata.json

      - name: Já existe, nada a fazer
        if: steps.check.outputs.raw_output != 'null' && steps.check.outputs.raw_output != ''
        run: echo "Instância já está rodando, pulando esta tentativa."
